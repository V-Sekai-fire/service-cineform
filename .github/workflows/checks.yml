# The runtime directory is the one thing this repository decides on its own, so it is the
# one thing checked without a bus. The round trip needs a built encoder, a built display
# and a live iceoryx2, so it runs from a desk rather than here; proof/roundtrip.py records
# what it measured and README.md carries the numbers.
name: checks
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-dir:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The scripts parse and the runtime directory resolves
        run: |
          python -m py_compile scripts/runtime_dir.py scripts/up.py proof/roundtrip.py
          python scripts/runtime_dir.py run
          python scripts/runtime_dir.py temp
          python scripts/runtime_dir.py root
      - name: An explicit override is honoured
        # In Python, not bash. Git Bash on Windows rewrites an argument that looks like a
        # POSIX path before the process ever sees it, so `CINEFORM_RUNTIME_DIR=/tmp/x`
        # arrived as `C:\Users\RUNNER~1\AppData\Local\Temp\x` and the comparison failed
        # against a value nothing in this repository chose. The check was wrong, not the
        # code it was checking.
        run: |
          python -c "
          import os, pathlib, subprocess, sys
          want = pathlib.Path(os.getcwd()) / 'cineform-check-override'
          env = dict(os.environ, CINEFORM_RUNTIME_DIR=str(want))
          got = subprocess.run([sys.executable, 'scripts/runtime_dir.py', 'run'],
                               capture_output=True, text=True, env=env, check=True).stdout.strip()
          assert got == str(want), f'override ignored: wanted {want}, got {got}'
          print('ok  ', got)
          "
